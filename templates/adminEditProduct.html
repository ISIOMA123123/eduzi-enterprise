{% extends "layout.html" %}

{% block title %}
Edit Product
{% endblock %}

{% block css %}
<link rel="styleheet" href="{{ url_for('static', filename='css/adminProducts.css') }}">
{% endblock %}

{% block body %}

<div class="container">
    <h1>Edit Product</h1>

    <form method="post">
        <label>Product Name</label>

        <input type="text" name="product_name" value="{{ product.product_name }}" required>

        <br><br>
        <label>Price</label>
        <input type="number" name="price" value="{{ product.price }}" step="0.01" required>

        <button type="submit">Update Product</button>
    </form>
</div>



{% endblock %}
